{% extends 'base.html' %}
{% block title %}Sign Up · Runguard AI{% endblock %}
{% block content %}
<section class="page">
  <h1>Create Account</h1>
  <p class="lead">Sign up to start making predictions.</p>
  {% if error %}
  <p style="color: #f85149;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/signup" class="auth-form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>
    
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    
    <button type="submit" class="btn primary full">Sign Up</button>
  </form>
  <p class="muted">Already have an account? <a href="/login">Login here</a></p>
</section>
{% endblock %}
