<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Runguard AI{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="nav-wrap">
  <nav class="nav container">
    <a class="brand" href="/">
      <span class="brand-logo">
        <span class="logo-main">RUNGUARD</span>
        <span class="logo-sub">AI</span>
      </span>
    </a>
    <div class="nav-links">
      <a class="{% if page == 'home' %}active{% endif %}" href="/">Home</a>
      <a class="{% if page == 'charts' %}active{% endif %}" href="/charts">Charts</a>
      <a class="{% if page == 'predict' %}active{% endif %}" href="/predict">Predict</a>
      <a class="{% if page == 'about' %}active{% endif %}" href="/about">About</a>
    </div>
    <div class="theme-picker">
      <label for="theme-select">Theme:</label>
      <select id="theme-select" class="theme-select">
        <option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark</option>
        <option value="light" {% if theme == 'light' %}selected{% endif %}>Light</option>
        <option value="rose" {% if theme == 'rose' %}selected{% endif %}>Rose</option>
        <option value="amber" {% if theme == 'amber' %}selected{% endif %}>Amber</option>
      </select>
    </div>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer container">Runguard AI · NumPy neural network · 50-coin forecasting</footer>
<script src="/static/js/app.js" defer></script>
</body>
</html>
